<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela toda, inclusive atrás do notch.
         user-scalable=no: sem zoom com pinça no meio da corrida. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cyberline Rivals</title>

    <!-- Tela cheia ao abrir pelo ícone da tela de início (Android e iPhone). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cyberline Rivals" />
    <meta name="theme-color" content="#05060a" />

    <link rel="preload" href="./assets/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game-container"></div>

    <!-- Só aparece em celular/tablet de toque com a tela em pé. -->
    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-icon"></div>
      <p>Gire o celular<br />para jogar</p>
    </div>

    <script src="js/phaser.min.js"></script>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
